<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P. Enhancement — 펜 강화 상점</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141C33;
    --ink-2:#1F2C4D;
    --paper:#F1E9D8;
    --paper-2:#E4D8BE;
    --gold:#C9A227;
    --gold-bright:#E7C158;
    --red:#8C3232;
    --green:#3C7A5A;
    --line: rgba(241,233,216,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(201,162,39,0.10), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(201,162,39,0.08), transparent 45%),
      var(--ink);
    color:var(--paper);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    padding-bottom:90px;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:22px 16px 40px;
  }
  header{
    text-align:center;
    margin-bottom:18px;
    position:relative;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.28em;
    color:var(--gold);
    text-transform:uppercase;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:32px;
    margin:6px 0 2px;
    letter-spacing:-0.01em;
  }
  .sub{
    font-size:13px;
    color:rgba(241,233,216,0.55);
  }
  .ledger{
    display:flex;
    justify-content:center;
    align-items:baseline;
    gap:6px;
    margin-top:14px;
    font-family:'JetBrains Mono', monospace;
  }
  .ledger .amt{
    font-size:26px;
    font-weight:600;
    color:var(--gold-bright);
  }
  .ledger .label{
    font-size:11px;
    color:rgba(241,233,216,0.5);
    letter-spacing:.1em;
  }

  /* seal / current pen card */
  .stage{
    background:linear-gradient(180deg, var(--ink-2), var(--ink));
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 20px 22px;
    margin-top:20px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .stage::before{
    content:"";
    position:absolute;
    top:-40%; left:-10%;
    width:120%; height:120%;
    background:radial-gradient(circle, rgba(201,162,39,0.08), transparent 60%);
    pointer-events:none;
  }
  .level-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.2em;
    color:var(--gold);
    text-transform:uppercase;
  }
  .medallion{
    width:120px;height:120px;
    margin:14px auto 12px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #2A3A63, #141C33 72%);
    border:2px solid var(--gold);
    box-shadow:0 0 0 5px rgba(201,162,39,0.10), inset 0 0 24px rgba(0,0,0,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:52px;
    transition:transform .25s ease;
  }
  .medallion.pulse{ animation:pulse .5s ease; }
  @keyframes pulse{
    0%{transform:scale(1);}
    35%{transform:scale(1.14);}
    100%{transform:scale(1);}
  }
  .pen-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:24px;
    margin:4px 0 6px;
  }
  .pen-desc{
    font-size:13px;
    color:rgba(241,233,216,0.62);
    padding:0 10px;
    min-height:34px;
    line-height:1.45;
  }
  .stat-row{
    display:flex;
    justify-content:center;
    gap:22px;
    margin:16px 0 4px;
    font-family:'JetBrains Mono', monospace;
  }
  .stat{
    text-align:center;
  }
  .stat .v{
    font-size:17px;
    font-weight:600;
    color:var(--paper);
  }
  .stat .k{
    font-size:10px;
    letter-spacing:.12em;
    color:rgba(241,233,216,0.45);
    text-transform:uppercase;
    margin-top:2px;
  }
  .stat.rate .v{ color:var(--gold-bright); }

  .btn-col{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  button{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    border:none;
    border-radius:10px;
    padding:13px 16px;
    cursor:pointer;
    transition:filter .15s ease, transform .1s ease;
  }
  button:active{ transform:scale(0.98); }
  .btn-primary{
    background:var(--gold);
    color:var(--ink);
  }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:disabled{
    background:#4a4530;
    color:rgba(241,233,216,0.4);
    cursor:not-allowed;
  }
  .btn-guarantee{
    background:transparent;
    color:var(--gold-bright);
    border:1px solid var(--gold);
  }
  .btn-store{
    background:transparent;
    color:var(--paper);
    border:1px solid var(--line);
  }
  .btn-store:hover{ border-color:rgba(241,233,216,0.5); }
  .btn-row{
    display:flex;
    gap:10px;
  }
  .btn-row button{
    flex:1;
    min-width:0;
  }
  .btn-sell-current{
    background:rgba(201,162,39,0.14);
    color:var(--gold-bright);
    border:1px solid var(--gold);
  }
  .btn-sell-current:hover{ filter:brightness(1.1); }
  .btn-sell-current:disabled{
    background:transparent;
    color:rgba(241,233,216,0.3);
    border:1px solid var(--line);
    cursor:not-allowed;
  }
  .btn-maxed{
    background:var(--green);
    color:var(--paper);
  }

  .toast{
    margin-top:12px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    padding:9px 10px;
    border-radius:8px;
    letter-spacing:.02em;
    min-height:14px;
  }
  .toast.success{ background:rgba(60,122,90,0.22); color:#8FD9AF; }
  .toast.fail{ background:rgba(140,50,50,0.22); color:#E6A0A0; }
  .toast.info{ background:rgba(201,162,39,0.14); color:var(--gold-bright); }

  /* inventory */
  section.inv{
    margin-top:26px;
  }
  .inv-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
    padding:0 2px;
  }
  .inv-head h2{
    font-family:'Fraunces', serif;
    font-size:18px;
    font-weight:700;
    margin:0;
  }
  .inv-head .count{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:rgba(241,233,216,0.45);
  }
  .empty-state{
    border:1px dashed var(--line);
    border-radius:12px;
    padding:26px 16px;
    text-align:center;
    font-size:13px;
    color:rgba(241,233,216,0.45);
  }
  .inv-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .inv-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
  }
  .inv-icon{
    width:38px;height:38px;
    border-radius:50%;
    background:rgba(201,162,39,0.10);
    border:1px solid rgba(201,162,39,0.3);
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
    flex-shrink:0;
  }
  .inv-info{
    flex:1;
    min-width:0;
  }
  .inv-info .n{
    font-size:14px;
    font-weight:600;
  }
  .inv-info .m{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:rgba(241,233,216,0.45);
  }
  .inv-actions{
    display:flex;
    gap:6px;
  }
  .inv-actions button{
    padding:8px 10px;
    font-size:12px;
    border-radius:8px;
  }
  .btn-sell1{ background:rgba(201,162,39,0.14); color:var(--gold-bright); }
  .btn-sellall{ background:rgba(201,162,39,0.24); color:var(--gold-bright); }

  /* ranking */
  .rank-section{ margin-top:22px; }
  .my-best{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .my-best-label{
    font-size:12px;
    color:rgba(241,233,216,0.5);
  }
  .my-best-value{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--gold-bright);
    font-weight:600;
  }
  .rank-register{
    display:flex;
    gap:8px;
    margin-bottom:6px;
  }
  .rank-register input{
    flex:1;
    min-width:0;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    color:var(--paper);
    font-family:'Space Grotesk', sans-serif;
    font-size:14px;
  }
  .rank-register input::placeholder{ color:rgba(241,233,216,0.35); }
  .rank-register input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .btn-rank-submit{
    background:var(--gold);
    color:var(--ink);
    border-radius:10px;
    padding:11px 16px;
    font-size:13px;
    white-space:nowrap;
  }
  .btn-rank-submit:disabled{
    background:#4a4530;
    color:rgba(241,233,216,0.4);
    cursor:not-allowed;
  }
  .rank-note{
    font-size:11px;
    color:rgba(241,233,216,0.35);
    margin-bottom:12px;
  }
  .rank-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .rank-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
  }
  .rank-row.me{ border-color:var(--gold); }
  .rank-pos{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    font-weight:700;
    color:var(--gold);
    width:22px;
    text-align:center;
    flex-shrink:0;
  }
  .rank-icon{
    width:34px;height:34px;
    border-radius:50%;
    background:rgba(201,162,39,0.10);
    border:1px solid rgba(201,162,39,0.3);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;
    flex-shrink:0;
  }
  .rank-info{ flex:1; min-width:0; }
  .rank-info .n{ font-size:13px; font-weight:600; }
  .rank-info .m{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:rgba(241,233,216,0.45);
  }

  /* floating revive button */
  .revive{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    justify-content:center;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(20,28,51,0), var(--ink) 30%);
  }
  .revive button{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background:var(--ink-2);
    color:rgba(241,233,216,0.7);
    border:1px solid var(--line);
    border-radius:999px;
    padding:10px 18px;
    letter-spacing:.04em;
  }
  .revive button:active{ color:var(--gold-bright); border-color:var(--gold); }

  @media (prefers-reduced-motion: reduce){
    .medallion.pulse{ animation:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Est. Level 0 — 흑연</div>
    <h1>P. Enhancement</h1>
    <div class="sub">펜을 강화하고, 보관하고, 팔아라</div>
    <div class="ledger">
      <span class="amt" id="money">5,000</span>
      <span class="label">원 보유</span>
    </div>
  </header>

  <div class="stage">
    <div class="level-tag" id="levelTag">0단계</div>
    <div class="medallion" id="medallion">🪨</div>
    <div class="pen-name" id="penName">흑연</div>
    <div class="pen-desc" id="penDesc">겨우 표시만 할수 있을 정도로 열악한 펜이다</div>

    <div class="stat-row">
      <div class="stat rate">
        <div class="v" id="statRate">100%</div>
        <div class="k">성공확률</div>
      </div>
      <div class="stat">
        <div class="v" id="statCost">100원</div>
        <div class="k">강화비용</div>
      </div>
      <div class="stat">
        <div class="v" id="statSell">0원</div>
        <div class="k">판매가</div>
      </div>
    </div>

    <div class="btn-col">
      <div class="btn-row">
        <button class="btn-primary" id="enhanceBtn">강화하기</button>
        <button class="btn-sell-current" id="sellCurrentBtn">판매하기</button>
      </div>
      <button class="btn-guarantee" id="guaranteeBtn" style="display:none;">확정 등급업 (같은 펜 3개 소모)</button>
      <button class="btn-store" id="storeBtn">보관함에 보관하기</button>
    </div>

    <div class="toast info" id="toast">준비 완료. 강화를 시작해보세요.</div>
  </div>

  <section class="inv">
    <div class="inv-head">
      <h2>보관함</h2>
      <span class="count" id="invCount">0개 보관 중</span>
    </div>
    <div id="invBody"></div>
  </section>

  <section class="inv rank-section">
    <div class="inv-head">
      <h2>랭킹</h2>
      <span class="count">보관한 최고 등급 기준</span>
    </div>
    <div class="my-best">
      <div class="my-best-label">내 최고 기록</div>
      <div class="my-best-value" id="myBestValue">아직 보관한 펜이 없습니다</div>
    </div>
    <div class="rank-register">
      <input type="text" id="nickInput" placeholder="닉네임 입력" maxlength="12">
      <button class="btn-rank-submit" id="rankSubmitBtn">랭킹에 등록</button>
    </div>
    <div class="rank-note">등록한 닉네임과 기록은 다른 사용자에게 공개됩니다.</div>
    <div id="rankBody"></div>
  </section>
</div>

<div class="revive">
  <button id="reviveBtn">🩹 회생 — 클릭당 +0.5원</button>
</div>


<script>
const PENS = [
  {name:"흑연", desc:"겨우 표시만 할수 있을 정도로 열악한 펜이다", icon:"🪨"},
  {name:"분필", desc:"흑연이랑 별 차이는 없지만 정형화된 펜이다", icon:"➖️"},
  {name:"몽당연필", desc:"너무 짧지만 그럭저럭 쓸만하다", icon:"✏️"},
  {name:"평범한 연필", desc:"연필이다", icon:"✏️✨️"},
  {name:"샤프", desc:"연필의 상위호환, 샤프심은 별도이다", icon:"🖊️"},
  {name:"고오급 샤프", desc:"일반 샤프와 거의 똑같지만 이걸 쓰면 기분이 더 좋다", icon:"🪄"},
  {name:"볼펜", desc:"진하고 부드럽다 유일한 단점은 지워지지 않는다", icon:"🖊️"},
  {name:"사인펜", desc:"정작 사인할땐 안쓰는게 함정이다", icon:"🪧"},
  {name:"컴퓨터용 사인펜", desc:"수험생의 필수품이지만 시험 일주일 전부터 모습을 감춘다", icon:"🦯"},
  {name:"네임펜", desc:"검정 사인펜 대체품으로 주로 쓰인다", icon:"🖊️"},
  {name:"보드마카", desc:"잘나오는 보드마카는 본적이 없다", icon:"🗂️"},
  {name:"유성매직", desc:"미술시간 끝판왕, 쓰고나면 책상이 알록달록해진다", icon:"🎨"},
  {name:"붓펜", desc:"3년에 일주일 정도 쓴다", icon:"🖌️"},
  {name:"만년필", desc:"만년필이지만 잉크 리필은 해본적 없다", icon:"✒️"},
  {name:"깃펜", desc:"영화에 자주 나오지만 실제로는 필기감이 엉망이다", icon:"🪶"},
  {name:"형광펜", desc:"색깔별로 다 있지만 그중 반만 쓴다", icon:"🖍️"},
  {name:"수정펜", desc:"펜의 반물질이다", icon:"🩹"},
  {name:"갤럭시 S펜", desc:"갤럭시 탭에 딸려있다", icon:"📱🖊"},
  {name:"애플펜슬", desc:"펜파인애플 애플펜", icon:"🍏🖊"},
  {name:"3D펜", desc:"안녕하세요 3D펜 장인 사나고입니다.", icon:"🖨️"},
  {name:"프라이팬", desc:"엉덩이 보호구이다.", icon:"🍳"},
  {name:"열혈팬", desc:"굉장히 열심인 펜이다", icon:"📣"},
  {name:"사생팬", desc:"정도가 지나친 팬이다.", icon:"📸"},
  {name:"안티팬", desc:"팬의 반물질이다.", icon:"😠"},
  {name:"피터팬", desc:"네버랜드 미라클 시티 워우예", icon:"🧚"},
  {name:"실링팬", desc:"천장에 달린 팬이다 사실 효과가 체감되지 않는다", icon:"🌀"},
  {name:"재팬", desc:"료이키 텐카이 무료쿠죠 아카 아오 무라사키", icon:"🇯🇵"},
  {name:"막스베르스타펜", desc:"뚜뚜뚜뚜 막스 베르스타펜", icon:"🏎️"},
  {name:"아르센뤼팬", desc:"괴도 루팡의 본토 발음이다", icon:"🎩"},
  {name:"라이프스팬", desc:"인생 펜", icon:"⏳"},
  {name:"투명펜", desc:"투명 펜이 울부짖었다 투명펜은 최강이다. 크아아앙", icon:"⬜️"},
];
const MAX_LEVEL = PENS.length - 1; // 30

function successRate(level){
  if(level <= 14) return 100 - 5*level;
  if(level <= 23) return 30 - 3*(level-14);
  return 1;
}
function enhanceCost(level){
  return Math.round(100 * Math.pow(2.5, level));
}
function cumulativeSpent(level){
  let total = 0;
  for(let i=0;i<level;i++) total += enhanceCost(i);
  return total;
}
function sellPrice(level){
  return Math.round(cumulativeSpent(level) * 1.5);
}

let money = 5000;
let currentLevel = 0;
let inventory = new Array(PENS.length).fill(0);
let bestEverStoredLevel = -1; // 보관함에 넣어본 펜 중 가장 높은 등급 (-1 = 없음)

const $ = id => document.getElementById(id);
const moneyEl = $("money"), levelTagEl = $("levelTag"), medallionEl = $("medallion"),
      penNameEl = $("penName"), penDescEl = $("penDesc"), statRateEl = $("statRate"),
      statCostEl = $("statCost"), statSellEl = $("statSell"), enhanceBtn = $("enhanceBtn"),
      guaranteeBtn = $("guaranteeBtn"), storeBtn = $("storeBtn"), sellCurrentBtn = $("sellCurrentBtn"), toastEl = $("toast"),
      invBody = $("invBody"), invCountEl = $("invCount"), reviveBtn = $("reviveBtn"),
      myBestValueEl = $("myBestValue"), nickInput = $("nickInput"), rankSubmitBtn = $("rankSubmitBtn"),
      rankBody = $("rankBody");

function fmt(n){
  const rounded = Math.round(n*10)/10;
  return rounded.toLocaleString('ko-KR', {maximumFractionDigits:1});
}

function setToast(msg, type){
  toastEl.textContent = msg;
  toastEl.className = "toast " + type;
}

function render(){
  moneyEl.textContent = fmt(money);
  const pen = PENS[currentLevel];
  levelTagEl.textContent = currentLevel + "단계";
  medallionEl.textContent = pen.icon;
  penNameEl.textContent = pen.name;
  penDescEl.textContent = pen.desc;

  const maxed = currentLevel >= MAX_LEVEL;
  if(maxed){
    statRateEl.textContent = "MAX";
    statCostEl.textContent = "—";
    enhanceBtn.textContent = "최고 등급 도달";
    enhanceBtn.className = "btn-maxed";
    enhanceBtn.disabled = true;
  } else {
    const rate = successRate(currentLevel);
    const cost = enhanceCost(currentLevel);
    statRateEl.textContent = rate + "%";
    statCostEl.textContent = fmt(cost) + "원";
    enhanceBtn.textContent = "강화하기 (" + fmt(cost) + "원)";
    enhanceBtn.className = "btn-primary";
    enhanceBtn.disabled = money < cost;
  }
  statSellEl.textContent = fmt(sellPrice(currentLevel)) + "원";

  const curSellPrice = sellPrice(currentLevel);
  if(currentLevel === 0 || curSellPrice <= 0){
    sellCurrentBtn.textContent = "판매하기";
    sellCurrentBtn.disabled = true;
  } else {
    sellCurrentBtn.textContent = "판매하기 (" + fmt(curSellPrice) + "원)";
    sellCurrentBtn.disabled = false;
  }

  if(!maxed && inventory[currentLevel] >= 3){
    guaranteeBtn.style.display = "block";
    guaranteeBtn.textContent = "확정 등급업 — " + pen.name + " 3개 소모 → " + (currentLevel+1) + "단계";
  } else {
    guaranteeBtn.style.display = "none";
  }

  renderInventory();
  renderMyBest();
}

function renderInventory(){
  const held = [];
  let totalCount = 0;
  for(let lvl=0; lvl<PENS.length; lvl++){
    if(inventory[lvl] > 0){
      held.push(lvl);
      totalCount += inventory[lvl];
    }
  }
  invCountEl.textContent = totalCount + "개 보관 중";

  if(held.length === 0){
    invBody.innerHTML = '<div class="empty-state">아직 보관한 펜이 없습니다.<br>강화 후 보관하기 버튼을 눌러보세요.</div>';
    return;
  }

  invBody.innerHTML = '<div class="inv-list" id="invList"></div>';
  const list = $("invList");
  held.forEach(lvl => {
    const pen = PENS[lvl];
    const price = sellPrice(lvl);
    const qty = inventory[lvl];
    const row = document.createElement("div");
    row.className = "inv-row";
    row.innerHTML = `
      <div class="inv-icon">${pen.icon}</div>
      <div class="inv-info">
        <div class="n">${pen.name} · ${lvl}단계 × ${qty}</div>
        <div class="m">개당 ${fmt(price)}원</div>
      </div>
      <div class="inv-actions">
        <button class="btn-sell1" data-lvl="${lvl}" data-mode="one">1개 판매</button>
        <button class="btn-sellall" data-lvl="${lvl}" data-mode="all">전부 판매</button>
      </div>`;
    list.appendChild(row);
  });

  list.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const lvl = parseInt(btn.dataset.lvl, 10);
      const mode = btn.dataset.mode;
      sellFromInventory(lvl, mode === "all" ? inventory[lvl] : 1);
    });
  });
}

function renderMyBest(){
  if(bestEverStoredLevel < 0){
    myBestValueEl.textContent = "아직 보관한 펜이 없습니다";
  } else {
    myBestValueEl.textContent = bestEverStoredLevel + "단계 · " + PENS[bestEverStoredLevel].name;
  }
  rankSubmitBtn.disabled = bestEverStoredLevel < 0;
}

function sanitizeNick(raw){
  const trimmed = raw.trim().slice(0, 12);
  return trimmed.replace(/[\s\/\\'"]/g, "");
}

async function loadLeaderboard(){
  rankBody.innerHTML = '<div class="empty-state">랭킹을 불러오는 중...</div>';
  try{
    const listResult = await window.storage.list('leaderboard:', true);
    const keys = (listResult && listResult.keys) ? listResult.keys : [];
    if(keys.length === 0){
      rankBody.innerHTML = '<div class="empty-state">아직 등록된 랭킹이 없습니다.<br>가장 먼저 기록을 등록해보세요.</div>';
      return;
    }
    const entries = [];
    for(const key of keys){
      try{
        const res = await window.storage.get(key, true);
        if(res && res.value){
          const parsed = JSON.parse(res.value);
          if(typeof parsed.level === "number" && parsed.name){
            entries.push(parsed);
          }
        }
      } catch(e){ /* skip unreadable entry */ }
    }
    entries.sort((a,b) => b.level - a.level);
    renderLeaderboard(entries.slice(0, 20));
  } catch(e){
    rankBody.innerHTML = '<div class="empty-state">랭킹을 불러오지 못했습니다.</div>';
  }
}

function renderLeaderboard(entries){
  if(entries.length === 0){
    rankBody.innerHTML = '<div class="empty-state">아직 등록된 랭킹이 없습니다.<br>가장 먼저 기록을 등록해보세요.</div>';
    return;
  }
  const myNick = sanitizeNick(nickInput.value || "");
  rankBody.innerHTML = '<div class="rank-list" id="rankList"></div>';
  const list = $("rankList");
  entries.forEach((entry, idx) => {
    const pen = PENS[entry.level] || PENS[0];
    const row = document.createElement("div");
    row.className = "rank-row" + (myNick && entry.name === myNick ? " me" : "");
    row.innerHTML = `
      <div class="rank-pos">${idx + 1}</div>
      <div class="rank-icon">${pen.icon}</div>
      <div class="rank-info">
        <div class="n">${entry.name}</div>
        <div class="m">${entry.level}단계 · ${pen.name}</div>
      </div>`;
    list.appendChild(row);
  });
}

rankSubmitBtn.addEventListener("click", async () => {
  const nick = sanitizeNick(nickInput.value || "");
  if(!nick){
    setToast("닉네임을 입력해주세요.", "fail");
    return;
  }
  if(bestEverStoredLevel < 0){
    setToast("먼저 펜을 보관함에 보관해야 등록할 수 있습니다.", "fail");
    return;
  }
  rankSubmitBtn.disabled = true;
  try{
    const payload = JSON.stringify({
      name: nick,
      level: bestEverStoredLevel,
      updatedAt: Date.now()
    });
    const result = await window.storage.set('leaderboard:' + nick, payload, true);
    if(result){
      setToast(nick + "님의 기록이 랭킹에 등록되었습니다.", "success");
      await loadLeaderboard();
    } else {
      setToast("랭킹 등록에 실패했습니다.", "fail");
    }
  } catch(e){
    setToast("랭킹 등록 중 오류가 발생했습니다.", "fail");
  }
  rankSubmitBtn.disabled = bestEverStoredLevel < 0;
});

function pulseMedallion(){
  medallionEl.classList.remove("pulse");
  void medallionEl.offsetWidth;
  medallionEl.classList.add("pulse");
}

enhanceBtn.addEventListener("click", () => {
  if(currentLevel >= MAX_LEVEL) return;
  const cost = enhanceCost(currentLevel);
  if(money < cost){
    setToast("자본이 부족합니다.", "fail");
    return;
  }
  money -= cost;
  const roll = Math.random() * 100;
  const rate = successRate(currentLevel);
  if(roll < rate){
    currentLevel += 1;
    pulseMedallion();
    setToast(PENS[currentLevel].name + "(으)로 강화 성공! (" + rate + "%)", "success");
  } else {
    setToast(PENS[currentLevel].name + " 강화 실패... 0단계로 돌아갑니다.", "fail");
    currentLevel = 0;
  }
  render();
});

guaranteeBtn.addEventListener("click", () => {
  if(currentLevel >= MAX_LEVEL) return;
  if(inventory[currentLevel] < 3) return;
  inventory[currentLevel] -= 3;
  const from = PENS[currentLevel].name;
  currentLevel += 1;
  pulseMedallion();
  setToast(from + " 3개를 소모해 " + PENS[currentLevel].name + "(으)로 확정 등급업!", "success");
  render();
});

sellCurrentBtn.addEventListener("click", () => {
  const price = sellPrice(currentLevel);
  if(currentLevel === 0 || price <= 0) return;
  const soldName = PENS[currentLevel].name;
  money += price;
  setToast(soldName + "을(를) 판매했습니다 (+" + fmt(price) + "원). 새 펜부터 다시 시작합니다.", "success");
  currentLevel = 0;
  render();
});

storeBtn.addEventListener("click", () => {
  inventory[currentLevel] += 1;
  if(currentLevel > bestEverStoredLevel){
    bestEverStoredLevel = currentLevel;
  }
  setToast(PENS[currentLevel].name + "을(를) 보관함에 보관했습니다. 새 펜부터 다시 시작합니다.", "info");
  currentLevel = 0;
  render();
});

function sellFromInventory(lvl, qty){
  if(inventory[lvl] < qty) return;
  const gain = sellPrice(lvl) * qty;
  inventory[lvl] -= qty;
  money += gain;
  setToast(PENS[lvl].name + " " + qty + "개 판매 완료 (+" + fmt(gain) + "원)", "success");
  render();
}

reviveBtn.addEventListener("click", () => {
  money += 0.5;
  render();
});

render();
loadLeaderboard();
</script>
</body>
</html>
